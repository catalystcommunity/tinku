# Tinku webapp — the nginx server block.
#
# This is a TEMPLATE, not a complete nginx.conf. webapp/Dockerfile copies it
# to /etc/nginx/templates/default.conf.template in the nginx-unprivileged
# image, whose stock entrypoint renders it through envsubst into
# /etc/nginx/conf.d/default.conf at container start. That is how the API URL
# env var below becomes a real upstream at runtime with no custom
# entrypoint. NGINX_LOCAL_RESOLVERS arrives the same way, from the base
# image's own 15-local-resolvers.envsh.
#
# NOTE: envsubst substitutes any dollar-brace token that names a real
# environment variable ANYWHERE in this file, comments included. Refer to
# env vars by bare name in prose, never in the dollar-brace form, or a
# comment mentioning one silently becomes its runtime value.
#
# Routing: the SPA owns every path that is not a real static asset, so
# unmatched paths fall through to /index.html. The two API-owned prefixes
# are proxied to tinku-api instead. The ops port is deliberately NOT
# proxied: /metrics is internal, and nothing in a browser should reach it.
server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # proxy_pass to a bare hostname resolves it ONCE at config load and
    # refuses to start nginx at all when it does not resolve yet — a
    # compose or rollout ordering race takes the whole webapp down with it.
    # Routing through a variable defers resolution to request time via this
    # resolver, so the container starts either way and only individual
    # requests 502 until the API is up.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;
    set $api_upstream ${TINKU_API_URL};

    # A probe for THIS container (nginx being alive), kept separate from the
    # API's own probes so checking the webapp does not depend on the API.
    location = /nginx-healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Vite emits content-hashed filenames under /assets/, so they can be
    # cached hard. index.html is deliberately left uncached by the fallback
    # below, so a new deploy is picked up on the next load.
    location /assets/ {
        add_header Cache-Control "public, immutable, max-age=31536000";
        try_files $uri =404;
    }

    # The CSIL-RPC carrier. Every op rides this one path.
    location /csil/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The identity provider's redirect target.
    location /auth/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: a real file if there is one, otherwise index.html.
    location / {
        try_files $uri /index.html;
    }
}

name: tinku-conventional-commits
description: "Check that every commit subject follows Conventional Commits."
job:
  image: containers.catalystsquad.com/public/reactorcide/runnerbase:latest
  command: "runnerlib run --job-command true"
  timeout: 300
  priority: 10
  working_dir: /job
environment:
  TINKU_JOB: conventional-commits

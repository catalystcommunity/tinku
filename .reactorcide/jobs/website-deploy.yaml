name: tinku-website-deploy
description: "Build the marketing site image and roll the Helm release."
job:
  image: containers.catalystsquad.com/public/reactorcide/runnerbase:latest
  command: "runnerlib run --job-command true"
  timeout: 1800
  # The image is built by a BuildKit sidecar, not by the job container.
  capabilities:
    - builder
  working_dir: /job
  run_local:
    user: host
environment:
  TINKU_JOB: deploy-website
  REGISTRY_INTERNAL: "10.16.0.1:5000"
  REGISTRY_INTERNAL_PATH: "private/catalystcommunity/tinku-website"
  REGISTRY_EXTERNAL: "containers.catalystsquad.com"
  REGISTRY_USER: "${secret:tinku/registry:user}"
  REGISTRY_PASSWORD: "${secret:tinku/registry:password}"
  KUBECONFIG_CONTENT: "${secret:tinku/k8s:kubeconfig}"
  # Its own namespace. The site shares a cluster with other sites and
  # nothing else.
  K8S_NAMESPACE: "tinku-website"
  HELM_RELEASE: "tinku-website"
  HELM_CHART: "catalyst-helm/pysocha-site"

name: tinku-website-deploy
description: "Build the marketing site image and roll the Helm release for one release tag."
job:
  image: containers.catalystsquad.com/public/reactorcide/runnerbase:latest
  command: "runnerlib run --job-command true"
  timeout: 1800
  # The image is built by a BuildKit sidecar, not by the job container.
  capabilities:
    - builder
  working_dir: /job
  run_local:
    user: host
environment:
  TINKU_JOB: deploy-website
  # The public registry, as every other catalystcommunity workload in this
  # cluster uses. linkkeys-website, the sibling PySocha site, is there too.
  REGISTRY: "containers.catalystsquad.com"
  REGISTRY_PATH: "public/catalystcommunity/tinku-website"
  REGISTRY_USER: "${secret:catalystcommunity/registry:user}"
  REGISTRY_PASSWORD: "${secret:catalystcommunity/registry:password}"
  KUBECONFIG_CONTENT: "${secret:catalystcommunity/k8s:kubeconfig}"
  # Its own namespace. The site shares a cluster with other sites and
  # nothing else.
  K8S_NAMESPACE: "tinku-website"
  HELM_RELEASE: "tinku-website"
  HELM_CHART: "catalyst-helm/pysocha-site"
